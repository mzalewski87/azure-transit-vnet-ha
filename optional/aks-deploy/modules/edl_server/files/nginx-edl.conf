# nginx site config for /edl/ — serves PAN-OS External Dynamic List files.
#
# Defense-in-depth: NSG on snet-edl restricts inbound TCP/80 to the transit
# mgmt subnet (CIDR of snet-mgmt where FW MGMT interfaces live). This nginx
# `allow`/`deny` block is a SECOND layer — if the NSG is misconfigured the
# files still cannot be served to the wrong source. ${MGMT_CIDR} placeholder
# is substituted by cloud-init at boot from the snet-mgmt CIDR variable.
#
# No HTTPS — PAN-OS EDL pull works over HTTP and the path stays inside the
# Azure network (mgmt VNet ↔ transit VNet via peering). Adding TLS would
# require certificate distribution which is overkill for an internal EDL feed.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/edl-access.log;
    error_log /var/log/nginx/edl-error.log warn;

    # / returns a small status page so operators landing here see something
    # informative rather than a directory listing or 404.
    location = / {
        default_type text/plain;
        return 200 "aks-edl server\nLists:\n  /edl/aks-egress-fqdn.txt\n  /edl/aks-egress-ips.txt\nLast generation log: /var/log/aks-edl-update.log\n";
    }

    # The actual EDL files. PAN-OS pulls these on its refresh interval.
    location /edl/ {
        alias /var/www/html/edl/;
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # IP allowlist — defence in depth on top of the subnet NSG.
        allow ${MGMT_CIDR};
        allow 127.0.0.1;
        deny all;

        # If the file isn't there yet (very first boot before the systemd
        # service runs), return 503 so PAN-OS retries on the next pull.
        try_files $uri =503;
    }
}
